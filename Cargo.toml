[package]
name = "impersonate-rs"
version = "0.1.0"
edition = "2021"
description = "A Rust wrapper for curl-impersonate, providing browser fingerprinting capabilities."
authors = ["Sisyphus <sisyphus@ohmyopencode.com>"]

[dependencies]
curl = "0.4"
curl-sys = "0.4"
thiserror = "1.0"
libc = "0.2"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
anyhow = "1.0"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "impersonate"
path = "src/bin/impersonate.rs"

[dependencies.clap]
version = "4.0"
features = ["derive"]
